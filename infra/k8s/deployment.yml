# =============================================================================
# Kubernetes manifests — AFTER managed-services migration
#
# Removed from BEFORE:
#   ✗ ChromaDB Deployment + Service   → Pinecone (managed)
#   ✗ PostgreSQL Deployment + PVC     → Cloud SQL (managed)
#   ✗ Redis Deployment + Service      → Memorystore (managed)
#
# Kept / updated:
#   ✓ API Deployment + HPA            → Cloud Run preferred; K8s as alternative
#   ✓ Frontend Deployment + HPA       → Cloud Run preferred; K8s as alternative
#
# All managed-service credentials come from the "rag-secrets" K8s Secret,
# which should be populated from GCP Secret Manager via External Secrets
# Operator or equivalent before applying this manifest.
# =============================================================================

# ── Namespace ─────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Namespace
metadata:
  name: rag-agent

---
# ── API Deployment ─────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-agent
  labels:
    app: rag-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rag-api
    spec:
      serviceAccountName: rag-workload-sa   # Must have Workload Identity → GCP SA with aiplatform.user
      containers:
        - name: api
          image: REGION-docker.pkg.dev/PROJECT_ID/rag-repo/rag-api:latest
          ports:
            - containerPort: 8000
          env:
            # LLM — Vertex AI Claude via Workload Identity (no API key)
            - name: LLM_PROVIDER
              value: vertexai
            - name: VERTEXAI_PROJECT
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: vertexai-project
            - name: VERTEXAI_LOCATION
              value: us-central1
            - name: VERTEXAI_MODEL
              value: claude-sonnet-4-5@20251205

            # Vector DB — Pinecone (replaces ChromaDB pod)
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: pinecone-api-key
            - name: PINECONE_INDEX_NAME
              value: universal-rag

            # Relational DB — Cloud SQL (replaces PostgreSQL pod)
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: database-url

            # Cache — Memorystore (replaces Redis pod)
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: redis-url

            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: jwt-secret
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: groq-api-key
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: tavily-api-key
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: cohere-api-key
            - name: ENVIRONMENT
              value: production

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-svc
  namespace: rag-agent
spec:
  selector:
    app: rag-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP

---
apiVersion: v1
kind: Service
metadata:
  name: rag-api-external
  namespace: rag-agent
spec:
  selector:
    app: rag-api
  ports:
    - port: 80
      targetPort: 8000
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-api-hpa
  namespace: rag-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-api
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

---
# ── Frontend Deployment ────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-frontend
  namespace: rag-agent
  labels:
    app: rag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: rag-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: rag-frontend
    spec:
      serviceAccountName: rag-workload-sa
      containers:
        - name: frontend
          image: REGION-docker.pkg.dev/PROJECT_ID/rag-repo/rag-frontend:latest
          ports:
            - containerPort: 8501
          env:
            - name: LLM_PROVIDER
              value: vertexai
            - name: VERTEXAI_PROJECT
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: vertexai-project
            - name: VERTEXAI_LOCATION
              value: us-central1
            - name: VERTEXAI_MODEL
              value: claude-sonnet-4-5@20251205
            - name: PINECONE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: pinecone-api-key
            - name: PINECONE_INDEX_NAME
              value: universal-rag
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: groq-api-key
            - name: TAVILY_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: tavily-api-key
            - name: COHERE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rag-secrets
                  key: cohere-api-key

          resources:
            requests:
              cpu: "500m"
              memory: "2Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"

          livenessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 60
            periodSeconds: 30
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /
              port: 8501
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3

---
apiVersion: v1
kind: Service
metadata:
  name: rag-frontend-svc
  namespace: rag-agent
spec:
  selector:
    app: rag-frontend
  ports:
    - port: 80
      targetPort: 8501
  type: LoadBalancer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rag-frontend-hpa
  namespace: rag-agent
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rag-frontend
  minReplicas: 2
  maxReplicas: 100
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
