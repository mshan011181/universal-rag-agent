substitutions:
  _REGION: us-central1
  _REPO: rag-repo
  _PROJECT: shan-project2
  _API_URL: https://rag-api-5tnihixkqq-uc.a.run.app

steps:
  # ── Stage 1: Install dev + API dependencies ───────────────────────────────────
  - name: python:3.12-slim
    id: install-deps
    entrypoint: pip
    args: [install, --quiet, --timeout, "120", --retries, "5", -r, requirements-dev.txt, -r, requirements-api.txt]

  # ── Stage 2: Lint (ruff) ──────────────────────────────────────────────────────
  - name: python:3.12-slim
    id: lint
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q ruff
        ruff check src/ api/ tests/
    waitFor: [install-deps]

  # ── Stage 3: Type check (mypy) ────────────────────────────────────────────────
  - name: python:3.12-slim
    id: typecheck
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q mypy
        mypy src/ api/ --ignore-missing-imports --no-error-summary --explicit-package-bases || true
    waitFor: [install-deps]

  # ── Stage 4: Security scan (bandit) ───────────────────────────────────────────
  - name: python:3.12-slim
    id: security-scan
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q bandit
        bandit -r src/ api/ -ll -q
    waitFor: [install-deps]

  # ── Stage 5: Tests + coverage gate (must all pass before any docker build) ────
  - name: python:3.12-slim
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -r requirements-dev.txt -r requirements-api.txt
        PYTHONPATH=. pytest \
          --tb=short \
          --cov=src \
          --cov=api \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=0 \
          -q
    env:
      - GROQ_API_KEY=test-key
      - PINECONE_API_KEY=test-pinecone-key
      - PINECONE_INDEX_NAME=test-index
      - JWT_SECRET=test-jwt-secret-for-ci-only
      - LLM_PROVIDER=groq
      - ENVIRONMENT=test
    waitFor: [lint, typecheck, security-scan]

  # ── Stage 6: Build API image (only runs if tests passed) ─────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:latest
      - --label
      - git.sha=$COMMIT_SHA
      - .
    waitFor: [test]

  # ── Stage 7: Build Frontend image (Next.js — replaces Streamlit) ─────────────
  # NEXT_PUBLIC_API_URL is baked into the client bundle at build time. The
  # docker builder image has no gcloud, so the URL comes from the _API_URL
  # substitution (Cloud Run URLs are stable per service+project).
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    args:
      - build
      - -f
      - Dockerfile.nextjs
      - --build-arg
      - NEXT_PUBLIC_API_URL=${_API_URL}
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:latest
      - --label
      - git.sha=$COMMIT_SHA
      - .
    waitFor: [test]

  # ── Stage 8: Push API image ───────────────────────────────────────────────────
  # Fetch an OAuth2 token from the GCE metadata server (always available in
  # Cloud Build) and use it to docker login — no gcloud or credential helper
  # binary needed. The SA must have roles/artifactregistry.writer on rag-repo.
  - name: gcr.io/cloud-builders/docker
    id: push-api
    entrypoint: bash
    args:
      - -c
      - |
        TOKEN=$(curl -sf \
          "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          -H "Metadata-Flavor: Google" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        echo "$$TOKEN" | docker login -u oauth2accesstoken --password-stdin \
          https://${_REGION}-docker.pkg.dev
        docker push --all-tags ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-api
    waitFor: [build-api]

  # ── Stage 9: Push Frontend image ─────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    entrypoint: bash
    args:
      - -c
      - |
        TOKEN=$(curl -sf \
          "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token" \
          -H "Metadata-Flavor: Google" \
          | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
        echo "$$TOKEN" | docker login -u oauth2accesstoken --password-stdin \
          https://${_REGION}-docker.pkg.dev
        docker push --all-tags ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend
    waitFor: [build-frontend]

  # ── Stage 10: Deploy API (FastAPI) to Cloud Run ───────────────────────────────
  # API stays at 4Gi/2CPU — Marker (STEM) is offloaded to the scale-to-zero
  # marker-ingest Job (Stage 10b), so the always-on API doesn't need 8Gi.
  # MARKER_JOB tells the API which Job to trigger for "Process as STEM" uploads.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-api
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=LLM_PROVIDER=anthropic,ANTHROPIC_MODEL=claude-sonnet-4-5,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=universal-rag-enterprise,LANGCHAIN_ENDPOINT=https://api.smith.langchain.com,PINECONE_INDEX_NAME=universal-rag,ENVIRONMENT=production,MEDIA_BUCKET=shan-project2-media-uploads,PYTHONUNBUFFERED=1,MARKER_JOB=marker-ingest,MARKER_JOB_REGION=${_REGION}
      - --set-secrets=PINECONE_API_KEY=pinecone-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,LANGCHAIN_API_KEY=langsmith-api-key:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,GROQ_API_KEY=groq-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest,COHERE_API_KEY=cohere-api-key:latest,RESEND_API_KEY=resend-api-key:latest,YOUTUBE_PROXY=youtube-proxy:latest
      - --add-cloudsql-instances=${_PROJECT}:${_REGION}:rag-postgres
      - --service-account=rag-cloudrun-sa@${_PROJECT}.iam.gserviceaccount.com
      - --min-instances=1
      - --max-instances=100
      - --concurrency=80
      - --memory=4Gi
      - --cpu=2
      - --timeout=3600
      # CPU always allocated — required so FastAPI BackgroundTasks (non-STEM
      # ingestion) keep running after the upload response returns.
      - --no-cpu-throttling
    waitFor: [push-api]

  # ── Stage 10b: Deploy Marker STEM Job (scale-to-zero) ─────────────────────────
  # Runs Marker at 16Gi/4CPU only while processing a STEM PDF (triggered by the
  # API). Scale-to-zero ⇒ no idle cost. Same image as the API; only the command
  # and resources differ. Jobs are billed per-execution and (unlike services)
  # do not reserve memory×100, so 16Gi/4CPU fits the current regional quota.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-marker-job
    entrypoint: bash
    args:
      - -c
      - |
        gcloud run jobs deploy marker-ingest \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-api:$COMMIT_SHA \
          --region=${_REGION} --project=${_PROJECT} \
          --command=python --args=jobs/marker_ingest.py \
          --memory=16Gi --cpu=4 --task-timeout=10800 --max-retries=0 \
          --set-env-vars=ENVIRONMENT=production,MEDIA_BUCKET=shan-project2-media-uploads,ENABLE_MARKER=true,PYTHONUNBUFFERED=1,PYTHONPATH=/app,LLM_PROVIDER=anthropic,PINECONE_INDEX_NAME=universal-rag,RECOGNITION_BATCH_SIZE=4,DETECTOR_BATCH_SIZE=4,LAYOUT_BATCH_SIZE=4,TABLE_REC_BATCH_SIZE=4,OCR_ERROR_BATCH_SIZE=4,ORDER_BATCH_SIZE=4,TORCH_DEVICE=cpu \
          --set-secrets=PINECONE_API_KEY=pinecone-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,DATABASE_URL=database-url:latest,GROQ_API_KEY=groq-api-key:latest \
          --set-cloudsql-instances=${_PROJECT}:${_REGION}:rag-postgres \
          --service-account=rag-cloudrun-sa@${_PROJECT}.iam.gserviceaccount.com
    waitFor: [push-api]

  # ── Stage 11: Deploy Frontend (Next.js) to Cloud Run ─────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$$(gcloud run services describe rag-api \
          --region=${_REGION} --project=${_PROJECT} --format="value(status.url)")
        gcloud run deploy rag-frontend \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --set-env-vars="NEXT_PUBLIC_API_URL=$$API_URL,ENVIRONMENT=production" \
          --service-account=rag-cloudrun-sa@${_PROJECT}.iam.gserviceaccount.com \
          --min-instances=1 \
          --max-instances=10 \
          --concurrency=80 \
          --memory=1Gi \
          --cpu=1
    waitFor: [push-frontend, deploy-api]

  # ── Stage 12: Upload coverage report as build artifact ────────────────────────
  - name: gcr.io/cloud-builders/gsutil
    id: upload-coverage
    entrypoint: bash
    args:
      - -c
      - |
        gsutil mb gs://${_PROJECT}-build-artifacts 2>/dev/null || true
        gsutil cp coverage.xml gs://${_PROJECT}-build-artifacts/rag/$COMMIT_SHA/coverage.xml || true
    waitFor: [test]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-frontend:$COMMIT_SHA

artifacts:
  objects:
    location: gs://$PROJECT_ID-build-artifacts/rag/$COMMIT_SHA/
    paths: [coverage.xml]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
