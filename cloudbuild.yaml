substitutions:
  _REGION: us-central1
  _REPO: rag-repo
  _PROJECT: shan-project2

steps:
  # ── Stage 1: Install dev + API dependencies ───────────────────────────────────
  - name: python:3.12-slim
    id: install-deps
    entrypoint: pip
    args: [install, --quiet, --timeout, "120", --retries, "5", -r, requirements-dev.txt, -r, requirements-api.txt]

  # ── Stage 2: Lint (ruff) ──────────────────────────────────────────────────────
  - name: python:3.12-slim
    id: lint
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q ruff
        ruff check src/ api/ tests/
    waitFor: [install-deps]

  # ── Stage 3: Type check (mypy) ────────────────────────────────────────────────
  - name: python:3.12-slim
    id: typecheck
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q mypy
        mypy src/ api/ --ignore-missing-imports --no-error-summary --explicit-package-bases || true
    waitFor: [install-deps]

  # ── Stage 4: Security scan (bandit) ───────────────────────────────────────────
  - name: python:3.12-slim
    id: security-scan
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q bandit
        bandit -r src/ api/ -ll -q
    waitFor: [install-deps]

  # ── Stage 5: Tests + coverage gate (must all pass before any docker build) ────
  - name: python:3.12-slim
    id: test
    entrypoint: bash
    args:
      - -c
      - |
        pip install -q -r requirements-dev.txt -r requirements-api.txt
        PYTHONPATH=. pytest \
          --tb=short \
          --cov=src \
          --cov=api \
          --cov-report=term-missing \
          --cov-report=xml:coverage.xml \
          --cov-fail-under=0 \
          -q
    env:
      - GROQ_API_KEY=test-key
      - PINECONE_API_KEY=test-pinecone-key
      - PINECONE_INDEX_NAME=test-index
      - JWT_SECRET=test-jwt-secret-for-ci-only
      - LLM_PROVIDER=groq
      - ENVIRONMENT=test
    waitFor: [lint, typecheck, security-scan]

  # ── Stage 6: Build API image (only runs if tests passed) ─────────────────────
  - name: gcr.io/cloud-builders/docker
    id: build-api
    args:
      - build
      - -f
      - Dockerfile
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:$COMMIT_SHA
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:latest
      - --label
      - git.sha=$COMMIT_SHA
      - .
    waitFor: [test]

  # ── Stage 7: Build Frontend image (Next.js — replaces Streamlit) ─────────────
  # NEXT_PUBLIC_API_URL is baked in at build time; the deploy step below reads
  # the live API URL after rag-api is deployed and passes it as a build-arg.
  - name: gcr.io/cloud-builders/docker
    id: build-frontend
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$$(gcloud run services describe rag-api \
          --region=${_REGION} --project=${_PROJECT} --format="value(status.url)" 2>/dev/null \
          || echo "https://rag-api-placeholder.a.run.app")
        docker build -f Dockerfile.nextjs \
          --build-arg NEXT_PUBLIC_API_URL="$$API_URL" \
          -t ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:$COMMIT_SHA \
          -t ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:latest \
          --label git.sha=$COMMIT_SHA \
          .
    waitFor: [test]

  # ── Stage 8a: Write docker credentials into shared volume ────────────────────
  # cloud-sdk has gcloud but no docker CLI; cloud-builders/docker has docker but
  # no gcloud. We bridge them with a named volume that holds the docker config.
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: configure-docker-auth
    entrypoint: gcloud
    args: [auth, configure-docker, ${_REGION}-docker.pkg.dev, --quiet]
    volumes:
      - name: docker-config
        path: /root/.docker
    waitFor: [build-api, build-frontend]

  # ── Stage 8: Push API image ───────────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-api
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-api
    volumes:
      - name: docker-config
        path: /root/.docker
    waitFor: [configure-docker-auth]

  # ── Stage 9: Push Frontend image ─────────────────────────────────────────────
  - name: gcr.io/cloud-builders/docker
    id: push-frontend
    args:
      - push
      - --all-tags
      - ${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend
    volumes:
      - name: docker-config
        path: /root/.docker
    waitFor: [configure-docker-auth]

  # ── Stage 10: Deploy API (FastAPI) to Cloud Run ───────────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-api
    entrypoint: gcloud
    args:
      - run
      - deploy
      - rag-api
      - --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-api:$COMMIT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --set-env-vars=LLM_PROVIDER=anthropic,ANTHROPIC_MODEL=claude-sonnet-4-5,LANGCHAIN_TRACING_V2=true,LANGCHAIN_PROJECT=universal-rag-enterprise,LANGCHAIN_ENDPOINT=https://api.smith.langchain.com,PINECONE_INDEX_NAME=universal-rag,ENVIRONMENT=production
      - --set-secrets=PINECONE_API_KEY=pinecone-api-key:latest,ANTHROPIC_API_KEY=anthropic-api-key:latest,LANGCHAIN_API_KEY=langsmith-api-key:latest,DATABASE_URL=database-url:latest,JWT_SECRET=jwt-secret:latest,GROQ_API_KEY=groq-api-key:latest,TAVILY_API_KEY=tavily-api-key:latest,COHERE_API_KEY=cohere-api-key:latest,RESEND_API_KEY=resend-api-key:latest
      - --add-cloudsql-instances=${_PROJECT}:${_REGION}:rag-postgres
      - --service-account=rag-cloudrun-sa@${_PROJECT}.iam.gserviceaccount.com
      - --min-instances=1
      - --max-instances=100
      - --concurrency=80
      - --memory=4Gi
      - --cpu=2
    waitFor: [push-api]

  # ── Stage 11: Deploy Frontend (Next.js) to Cloud Run ─────────────────────────
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    id: deploy-frontend
    entrypoint: bash
    args:
      - -c
      - |
        API_URL=$$(gcloud run services describe rag-api \
          --region=${_REGION} --project=${_PROJECT} --format="value(status.url)")
        gcloud run deploy rag-frontend \
          --image=${_REGION}-docker.pkg.dev/${_PROJECT}/${_REPO}/rag-frontend:$COMMIT_SHA \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --set-env-vars="NEXT_PUBLIC_API_URL=$$API_URL,ENVIRONMENT=production" \
          --service-account=rag-cloudrun-sa@${_PROJECT}.iam.gserviceaccount.com \
          --min-instances=1 \
          --max-instances=100 \
          --concurrency=80 \
          --memory=1Gi \
          --cpu=1
    waitFor: [push-frontend, deploy-api]

  # ── Stage 12: Upload coverage report as build artifact ────────────────────────
  - name: gcr.io/cloud-builders/gsutil
    id: upload-coverage
    entrypoint: bash
    args:
      - -c
      - |
        gsutil mb gs://${_PROJECT}-build-artifacts 2>/dev/null || true
        gsutil cp coverage.xml gs://${_PROJECT}-build-artifacts/rag/$COMMIT_SHA/coverage.xml || true
    waitFor: [test]

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-api:$COMMIT_SHA
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO}/rag-frontend:$COMMIT_SHA

artifacts:
  objects:
    location: gs://$PROJECT_ID-build-artifacts/rag/$COMMIT_SHA/
    paths: [coverage.xml]

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
